<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTMG Shiny & ST Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="rotmg sheet/whbaic.png">
</head>
<body>
    <div id="tooltip"></div>
    
    <div class="top-controls">
        <input type="text" id="search-bar" placeholder="Search...">
        <button id="reset-btn">Reset</button>
        
        <div class="info-wrapper">
            <button id="info-btn">ⓘ</button>
            <div class="custom-tooltip">
                <strong>Storage Info:</strong><br>
                Your progress is saved locally in this browser. Clearing cache or history will reset your tracker!
            </div>
        </div>
    </div>

    <div class="filter-container">
        
        <div class="filter-group">
            <label>Difficulty</label>
            <select id="difficulty-filter" class="filter-select">
                <option value="all">Difficulty</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="exalt">Exalt</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Type</label>
            <select id="type-filter" class="filter-select">
                <option value="all">Type</option>
                <option value="weapon">Weapon</option>
                <option value="ability">Ability</option>
                <option value="armor">Armor</option>
                <option value="ring">Ring</option>
            </select>
        </div>

        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="missing-filter"> Missing Only
            </label>
        </div>
    </div>

    <div class="page-nav">
        <a class="nav-btn" href="index.html">ST Sets</a>
        <a class="nav-btn active" href="shiny.html">Shiny</a>
        <a class="nav-btn" href="whitebags.html">White Bags</a>
    </div>
    
    <div id="progress-bar-container">
        <div id="progress-bar-fill"></div>
    </div>
    <div id="progress-label">0 / 0 obtained</div>

    <div id="tracker-grid" class="grid"></div>

    <footer style="margin-top: 50px; padding: 20px; border-top: 1px solid #c8a951; text-align: center; background: rgba(0,0,0,0.3);">
        <div style="margin-bottom: 15px;">
            <p style="color: #c8a951; font-weight: bold;">Enjoying the tracker?</p>
            <a href="https://buymeacoffee.com/malimate" target="_blank" 
               style="background: #ffc439; color: black; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold;">
                Support the Project (Buy Me a Coffee)
            </a>
        </div>
        <div>
            <p style="font-size: 14px;">Have ideas or found a bug?</p>
            <a href="mailto:rotmgtracker1@gmail.com?subject=RotMG Tracker Idea" style="color: #00ffcc;">
                Send me an Email
            </a>
        </div>
    </footer>

    <button id="topBtn" title="Go to top">↑</button>

    <script src="script_s.js"></script>
</body>
</html>
